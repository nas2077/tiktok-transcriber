name: ZIP repro (temporary)
on:
  push:
    branches: [claude/dreamy-dirac-qibhik]
permissions:
  contents: read
jobs:
  repro:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        motw: [marked, clean]
    steps:
      - name: Download, extract and start the published 0.2.1 ZIP
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'TikTok-Transcriber-0.2.1-windows-x64.zip'
          Invoke-WebRequest -Uri 'https://github.com/nas2077/tiktok-transcriber/releases/download/v0.2.1/TikTok-Transcriber-0.2.1-windows-x64.zip' -OutFile $zip
          $dest = Join-Path $env:USERPROFILE 'Downloads\Prova ZIP'
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          if ('${{ matrix.motw }}' -eq 'marked') {
            # what Explorer's Extract All leaves on every file of a downloaded ZIP
            Get-ChildItem -LiteralPath $dest -Recurse -File | ForEach-Object {
              Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://github.com/"
            }
          }
          $exe = Join-Path $dest 'TikTok Transcriber\TikTok Transcriber.exe'
          Get-Item -LiteralPath $exe -Stream * | Format-Table Stream, Length
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 40
          Write-Host "exited: $($app.HasExited)"
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          $crash = Join-Path $env:LOCALAPPDATA 'TikTok Transcriber\crash.log'
          if (Test-Path $crash) { Get-Content $crash; throw 'crash.log was written' }
          Write-Host 'stayed open, no crash.log'
