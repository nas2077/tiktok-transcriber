name: Distro check
# TEMPORARY, for the packaging branch: repeat only the distribution install
# tests on the packages an earlier Release run already built, instead of
# rebuilding everything. Remove before merging.
on:
  push:
    branches: [cross-platform-packages]
    paths: [dev/distro_check.sh, .github/workflows/distro-check.yml]
permissions:
  contents: read
  actions: read
env:
  SOURCE_RUN: '39909423612'
jobs:
  distros:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'ubuntu:22.04', kind: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'ubuntu:24.04', kind: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'debian:12', kind: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'debian:13', kind: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'linuxmintd/mint22-amd64', kind: deb, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'fedora:42', kind: rpm, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'almalinux:10', kind: rpm, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'opensuse/tumbleweed', kind: rpm, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'archlinux:latest', kind: arch, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'fedora:42', kind: appimage, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'debian:12', kind: appimage, arch: x86_64, runner: ubuntu-24.04}
          - {image: 'ubuntu:24.04', kind: deb, arch: aarch64, runner: ubuntu-24.04-arm}
          - {image: 'debian:13', kind: deb, arch: aarch64, runner: ubuntu-24.04-arm}
          - {image: 'fedora:42', kind: rpm, arch: aarch64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: pkg
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Install with the package manager and start the app
        shell: sh
        run: sh dev/distro_check.sh ${{ matrix.kind }} pkg
