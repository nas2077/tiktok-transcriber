name: Checks
on:
  push:
    # TEMPORARY: cross-platform-packages runs here until it is merged
    branches: [main, cross-platform-packages]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            dev/requirements.txt
            dev/constraints.txt
            dev/requirements-dev.txt
      - name: Install tested dependencies
        run: python -m pip install -r dev/requirements.txt -c dev/constraints.txt -r dev/requirements-dev.txt
      - name: Compile and validate repository
        run: |
          python -m compileall -q src dev
          python dev/repository_check.py
      - name: Offline regressions
        run: |
          python dev/core_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/access_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/readability_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/natural_contract_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/model_matrix_check.py
      - name: Interface checks in WebView2
        if: runner.os == 'Windows'
        run: |
          foreach ($check in 'ui_check', 'controls_check', 'design_check', 'navigation_check', 'localization_check') {
            Write-Host "== $check"
            python "dev/$check.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Audit Python dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install -r dev/requirements-audit.txt
          python -m pip_audit --no-deps --disable-pip -r dev/constraints.txt --strict
