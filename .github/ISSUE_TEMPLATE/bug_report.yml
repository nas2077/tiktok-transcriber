name: Bug report
description: Report a reproducible problem.
body:
  - type: input
    id: version
    attributes:
      label: TikTok Transcriber version and Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the selected model, language, and output format.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private content and local personal paths before posting.
      render: text
