# .deb, .rpm and Arch packages of the Linux bundle. Run by dev/make_packages.py
# from the repository root with TIKTOK_TRANSCRIBER_VERSION and TIKTOK_TRANSCRIBER_ARCH (amd64/arm64).
name: tiktok-transcriber
arch: ${TIKTOK_TRANSCRIBER_ARCH}
platform: linux
version: ${TIKTOK_TRANSCRIBER_VERSION}
release: 1
section: sound
priority: optional
maintainer: Nas <noreply@github.com>
vendor: Nas
homepage: https://github.com/nas2077/tiktok-transcriber
license: MIT
description: |-
  Readable transcripts from public TikTok clips and profiles.
  Recognition runs locally with integrated Qwen and Whisper models.

# The bundle carries Python, Qt and the speech engines. These are the system
# libraries Qt WebEngine still expects from the distribution.
overrides:
  deb:
    depends:
      - libnss3
      - libasound2t64 | libasound2
      - libgl1
      - libegl1
      - libxkbcommon0
      - libfontconfig1
      - libdbus-1-3
  # by library rather than package name: Fedora, RHEL and openSUSE name the
  # packages differently but all resolve these
  rpm:
    depends:
      - libnss3.so()(64bit)
      - libasound.so.2()(64bit)
      - libGL.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libfontconfig.so.1()(64bit)
      - libdbus-1.so.3()(64bit)
  archlinux:
    depends:
      - nss
      - alsa-lib
      - libglvnd
      - libxkbcommon
      - fontconfig
      - dbus

contents:
  - src: ./dev/build/dist/tiktok-transcriber
    dst: /opt/tiktok-transcriber
    type: tree
  - src: /opt/tiktok-transcriber/tiktok-transcriber
    dst: /usr/bin/tiktok-transcriber
    type: symlink
  - src: ./packaging/linux/io.github.nas2077.TikTokTranscriber.desktop
    dst: /usr/share/applications/io.github.nas2077.TikTokTranscriber.desktop
  - src: ./packaging/linux/io.github.nas2077.TikTokTranscriber.metainfo.xml
    dst: /usr/share/metainfo/io.github.nas2077.TikTokTranscriber.metainfo.xml
  - src: ./src/icon.png
    dst: /usr/share/icons/hicolor/512x512/apps/io.github.nas2077.TikTokTranscriber.png
  - src: ./LICENSE
    dst: /usr/share/licenses/tiktok-transcriber/LICENSE
