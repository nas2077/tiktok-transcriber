# `pipx install syllark` / `uv tool install syllark` and `pip install .`.
# The desktop packages in Releases are built separately with PyInstaller
# (dev/build.spec); this file only describes the Python package.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "syllark"
dynamic = ["version"]
description = "Readable transcripts from public TikTok clips and profiles, with local Qwen and Whisper."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Nas" }]
requires-python = ">=3.11"
keywords = ["transcription", "speech-recognition", "whisper", "qwen", "tiktok", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "yt-dlp[default,curl-cffi]>=2025.1.1",
    "faster-whisper>=1.1.0",
    "transcribe-cpp==0.4.0",
    "transcribe-cpp-native==0.4.0",
    "av>=12.0.0,<19",
    "pywebview>=5.0",
    "pythonnet>=3.0.3; sys_platform == 'win32'",
    "pywebview[qt]>=5.0; sys_platform == 'linux'",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/nas2077/syllark"
Releases = "https://github.com/nas2077/syllark/releases"
Issues = "https://github.com/nas2077/syllark/issues"

[project.gui-scripts]
syllark = "syllark.app:run"

[tool.setuptools]
# The modules live in src/ and import each other by plain name; installed,
# they sit together in one `syllark` folder that app.py puts on the path.
package-dir = { "syllark" = "src" }
packages = ["syllark"]
include-package-data = false

[tool.setuptools.package-data]
syllark = [
    "*.html", "*.js", "*.ico", "*.png",
    "locales/*.json",
    "vendor/*.js", "vendor/*.css",
    "licenses/*.txt", "licenses/*.json", "licenses/**/*",
]

[tool.setuptools.dynamic]
version = { attr = "syllark.tiktok_core.APP_VERSION" }
